
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAELMOR VERDICT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070a;color:#eee;font-family:monospace;min-height:100vh;position:relative}
body:before{content:"";position:fixed;inset:0;background:url("vaelmor-family.jpg") center 35%/cover no-repeat;opacity:.2;z-index:-2}
body:after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.76);z-index:-1;pointer-events:none}
.top{display:flex;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid #333}
.j{font-size:9px;letter-spacing:4px;color:#888;text-align:center;margin:22px 0}
.t{font-size:clamp(20px,5vw,28px);letter-spacing:4px;text-align:center;color:#ddd;margin:10px 0}
.c{width:160px;height:160px;margin:0 auto 16px;border-radius:50%;border:2px solid #555;overflow:hidden;background:#111}
.c img{width:100%;height:100%;object-fit:cover;display:block}
.s{font-size:9px;letter-spacing:3px;color:#999;text-align:center;line-height:17px;margin-bottom:20px}
.card{max-width:420px;margin:0 auto 24px;background:rgba(14,14,17,.94);border:1px solid #444;border-radius:20px;padding:16px}
.r{display:flex;justify-content:space-between;gap:8px;font-size:8px;letter-spacing:2px;color:#aaa;margin-bottom:12px}
.i{display:flex;background:#050507;border:1px solid #333;border-radius:14px;margin-bottom:12px}
.i span{padding:16px 12px;font-size:12px;color:#aaa;border-right:1px solid #333}
.i input{flex:1;min-width:0;background:transparent;border:0;color:#fff;padding:16px;font-size:15px;outline:0}
.b{width:100%;min-height:52px;border-radius:14px;border:1px solid #666;background:linear-gradient(#3a3a3e,#151518);color:#eee;letter-spacing:3px;font-size:11px;cursor:pointer;padding:12px}
.b:disabled{opacity:.6}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(12px);display:none;place-items:center;z-index:99;padding:16px}
.ov.show{display:grid}
.v{width:100%;max-width:380px;background:#0f0f12;border:1px solid #444;border-radius:20px;padding:20px;position:relative;animation:p .3s}
@keyframes p{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.x{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:#1a1a1e;border:1px solid #444;color:white;cursor:pointer}
.tt{font-size:15px;letter-spacing:1px;color:#ddd;margin:14px 0}
.qq{color:#ccc;line-height:22px;margin:10px 0;overflow-wrap:anywhere}
.off{font-size:9px;letter-spacing:1px;color:#aaa;margin-top:16px}
#bd{font-size:9px;padding:7px 10px;border:1px solid #555;border-radius:99px;display:inline-block;color:#ddd;margin-top:8px}
@media(max-width:460px){.card{margin-left:12px;margin-right:12px}.j{letter-spacing:2px}.top{font-size:10px}}
</style>
</head>
<body>

<div class="top">
  <div><b style="letter-spacing:2px;font-size:10px">VAELMOR FAMILY</b></div>
  <div style="font-size:9px;color:#aaa">VAELMOR VERDICT</div>
</div>

<div class="j">JUGEMENT SUPRÊME</div>
<div class="t">VAELMOR VERDICT</div>

<div class="c">
  <img src="icon.png" alt="VAELMOR FAMILY">
</div>

<div class="s">
  VÉRIFICATION DE STATUT WHATSAPP<br>
  RÉSULTATS NON CONFIRMÉS SIGNALÉS
</div>

<div class="card">
  <div class="r">
    <span>CIBLE À JUGER</span>
    <span>VLM</span>
  </div>

  <div class="i">
    <span>INTL</span>
    <input id="n" inputmode="tel" placeholder="Numéro international" aria-label="Numéro de téléphone">
    <span id="clear" style="cursor:pointer">✕</span>
  </div>

  <button class="b" id="j">[ JUGER LA CIBLE ]</button>

  <div style="font-size:8px;letter-spacing:2px;color:#777;text-align:center;margin-top:12px">
    VAELMOR • VERDICT • VÉRIFICATION
  </div>
</div>

<div class="ov" id="o">
  <div class="v">
    <button class="x" id="cx" aria-label="Fermer">✕</button>
    <div style="font-size:9px;letter-spacing:3px;color:#999">VERDICT RENDU</div>
    <div id="ph" style="font-size:11px;margin:8px 0">—</div>
    <div id="bd">EN ATTENTE</div>
    <div class="tt" id="ti">VÉRIFICATION</div>
    <div class="qq" id="qt">En attente d'une réponse.</div>
    <div class="off" id="of">𓆩🌹 𝗩𝗔𝗘𝗟𝗠𝗢𝗥 𝗙𝗔𝗠𝗜𝗟𝗬 🕯️𓆪</div>
  </div>
</div>

<script>
const verdicts = {
  INVALID_NUMBER: {
    title: 'NUMÉRO INVALIDE',
    message: 'Vérifie le numéro et son indicatif international.'
  },
  INDETERMINATE: {
    title: 'STATUT INDÉTERMINÉ',
    message: 'Aucune preuve suffisante pour confirmer le statut du compte. Va dans WhatsApp pour vérifier le message affiché par l’application.'
  }
};

const overlay = document.getElementById('o');
const numberInput = document.getElementById('n');
const button = document.getElementById('j');

function showResult(status, phone, message) {
  const result = verdicts[status] || verdicts.INDETERMINATE;

  document.getElementById('ti').textContent = result.title;
  document.getElementById('qt').textContent = message || result.message;
  document.getElementById('bd').textContent = status;
  document.getElementById('ph').textContent =
    phone + ' • ' + new Date().toLocaleTimeString();

  overlay.classList.add('show');
}

button.addEventListener('click', async () => {
  const digits = numberInput.value.replace(/\D/g, '');

  if (!digits) {
    showResult('INVALID_NUMBER', '—');
    return;
  }

  button.disabled = true;
  button.textContent = '[ VÉRIFICATION EN COURS… ]';

  document.getElementById('ti').textContent = 'VÉRIFICATION EN COURS';
  document.getElementById('qt').textContent =
    'Attente de la réponse du serveur…';
  document.getElementById('bd').textContent = 'EN COURS';
  document.getElementById('ph').textContent = '+' + digits;
  overlay.classList.add('show');

  try {
    const response = await fetch('/api/check/' + encodeURIComponent(digits));
    const data = await response.json();

    showResult(
      data.status || 'INDETERMINATE',
      data.phone || ('+' + digits),
      data.message
    );
  } catch (error) {
    showResult(
      'INDETERMINATE',
      '+' + digits,
      'Impossible de joindre le serveur. Aucun verdict n’a été inventé.'
    );
  } finally {
    button.disabled = false;
    button.textContent = '[ JUGER LA CIBLE ]';
  }
});

document.getElementById('clear').addEventListener('click', () => {
  numberInput.value = '';
  numberInput.focus();
});

document.getElementById('cx').addEventListener('click', () => {
  overlay.classList.remove('show');
});

overlay.addEventListener('click', event => {
  if (event.target === overlay) overlay.classList.remove('show');
});
</script>
</body>
</html>
